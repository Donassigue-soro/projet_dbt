version: 2

models:
  - name: dim_customers
    description: >
      Une ligne par client unique (customer_unique_id), avec ses statistiques
      de commande agrégées. 97% des clients sont 'one_time' (EDA), le reste 'returning'.
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null

      - name: nb_orders
        tests:
          - not_null

      - name: customer_type
        tests:
          - accepted_values:
              arguments:
                values: ['one_time', 'returning']
  - name: fct_orders
    description: >
      Une ligne par commande, avec les montants, délais et satisfaction agrégés.
      Grain = order_id.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id

      - name: total_payment_value
        tests:
          - not_null

      - name: is_late_delivery
        description: True si livrée après la date estimée (8.11% des commandes livrées, vu en EDA)
  - name: dim_products
    description: >
      Une ligne par produit, enrichie de statistiques de vente agrégées
      depuis order_items. Certains produits n'ont jamais été vendus (nb_times_sold = 0).
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

      - name: nb_times_sold
        tests:
          - not_null
  - name: dim_sellers
    description: >
      Une ligne par vendeur, enrichie de statistiques de vente agrégées
      depuis order_items.
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

      - name: nb_items_sold
        tests:
          - not_null
  - name: fct_order_items
    description: >
      Une ligne par article commandé (grain = order_id + order_item_id),
      enrichie du contexte commande. Base pour les analyses croisées produit/vendeur.
    columns:
      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id